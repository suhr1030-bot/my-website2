<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業人脈管理中心 (CRM)</title>

  <!-- 1. CDN: React 核心引擎與 Babel 編譯器 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 2. CDN: Firebase 核心模組 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- 3. CDN: Tailwind CSS 與 Google Material Symbols -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

  <!-- 4. Tailwind 客製化設定 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0081A7',    // 深海藍
            teal: '#00AFB9',    // 湖水綠
            cream: '#FDFCDC',   // 奶油白
            peach: '#FED9B7',   // 蜜桃粉
            coral: '#F07167',   // 珊瑚紅
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- 5. 全域 CSS -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { background-color: #FDFCDC; margin: 0; font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .icon { vertical-align: middle; font-size: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // 雲端資料庫設定區
    // ==========================================
    const firebaseConfig = {
      // apiKey: "YOUR_API_KEY",
      // authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      // projectId: "YOUR_PROJECT_ID",
      // storageBucket: "YOUR_PROJECT_ID.appspot.com",
      // appId: "YOUR_APP_ID"
    };

    const isCloudEnabled = firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";
    let db = null, auth = null;
    
    if (isCloudEnabled) {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      auth = firebase.auth();
    }

    // ==========================================
    // 基礎元件庫
    // ==========================================
    const Icon = ({ name, className = "" }) => (
      <span className={`material-symbols-rounded icon ${className}`}>{name}</span>
    );

    const DEFAULT_CATEGORIES = ['職涯', '生活', '技術', '投資'];
    const PREDEFINED_TAGS = ['UI/UX設計', '前端開發', '後端架構', '專案管理', '產品企劃', '數位行銷', '社群經營', '數據分析', '投資理財', '法務諮詢', '人力資源'];

    // 智慧標籤元件
    function HashtagInput({ value = [], onChange, suggestions = PREDEFINED_TAGS }) {
      const [input, setInput] = useState('');
      const handleKeyDown = (e) => {
        if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); if (input.trim()) addTag(input); }
      };
      const addTag = (tag) => {
        const trimmed = tag.trim().replace(/^#+/, '');
        if (trimmed && !value.includes(trimmed)) onChange([...value, trimmed]);
        setInput('');
      };
      const removeTag = (tagToRemove) => onChange(value.filter(t => t !== tagToRemove));
      const availableSuggestions = suggestions.filter(t => !value.includes(t));
      const filteredSuggestions = input.trim() === '' ? availableSuggestions : availableSuggestions.filter(t => t.toLowerCase().includes(input.toLowerCase().trim()));

      return (
        <div className="space-y-3">
          <div className="flex flex-wrap gap-2 p-2.5 min-h-[3.2rem] bg-white border border-teal/30 rounded-xl focus-within:ring-2 focus-within:ring-teal transition-all cursor-text" onClick={() => document.getElementById('hashtag-input')?.focus()}>
            {value.map(tag => (
              <span key={tag} className="inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-bold bg-peach text-navy shadow-sm">
                <span className="text-coral mr-0.5 opacity-90">#</span>{tag}
                <button type="button" onClick={(e) => { e.stopPropagation(); removeTag(tag); }} className="ml-1.5 text-navy hover:text-coral focus:outline-none"><Icon name="close" className="!text-[16px]"/></button>
              </span>
            ))}
            <input id="hashtag-input" type="text" value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKeyDown} className="flex-1 bg-transparent min-w-[140px] outline-none text-sm font-medium text-slate-700 placeholder-teal/50 py-1" placeholder={value.length === 0 ? "輸入專長或選擇下方建議..." : "繼續新增..."} autoComplete="off" />
          </div>
          {(filteredSuggestions.length > 0 || input.trim() !== '') && (
            <div className="bg-white/50 p-3 rounded-xl border border-teal/20 shadow-sm">
              <div className="text-xs font-bold text-navy/60 mb-2.5 flex items-center">
                <Icon name="sparkles" className="!text-[14px] mr-1 text-coral" />{input.trim() === '' ? '推薦專長 (點擊加入)' : `相關建議`}
              </div>
              <div className="flex flex-wrap gap-2 max-h-36 overflow-y-auto hide-scrollbar">
                {filteredSuggestions.map(tag => (
                  <button key={tag} type="button" onClick={() => addTag(tag)} className="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-bold bg-white border border-teal/30 text-navy hover:bg-teal/10 transition-all active:scale-95 shadow-sm"><Icon name="add" className="!text-[14px] mr-1 opacity-50" />{tag}</button>
                ))}
                {input.trim() !== '' && !filteredSuggestions.some(t => t.toLowerCase() === input.trim().toLowerCase()) && (
                  <button type="button" onClick={() => addTag(input)} className="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-bold bg-coral text-white transition-all active:scale-95 shadow-sm"><Icon name="add" className="!text-[14px] mr-1" />建立新標籤 "{input.trim()}"</button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 核心系統 (App主控台)
    // ==========================================
    function App() {
      const [adminId] = useState(() => {
        const saved = localStorage.getItem('crm_admin_id');
        if (saved) return saved;
        const newId = 'DB-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        localStorage.setItem('crm_admin_id', newId);
        return newId;
      });

      const [contacts, setContacts] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('全部');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isParsingCard, setIsParsingCard] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [viewingContact, setViewingContact] = useState(null); // 控制獨立檢視視窗
      
      const [formData, setFormData] = useState({
        name: '', role: '', company: '', email: '', phone: '', lineId: '', instagram: '', otherLink: '', cardImage: '', skills: [], notes: '', trustLevel: 3, lastContacted: new Date().toISOString().split('T')[0], category: '技術', customCategory: ''
      });

      const fileInputRef = useRef(null);

      // 連線資料庫
      useEffect(() => {
        if (!isCloudEnabled) {
          const localData = JSON.parse(localStorage.getItem(`crm_data_${adminId}`) || '[]');
          localData.sort((a, b) => b.createdAt - a.createdAt);
          setContacts(localData);
          setIsLoading(false);
          return;
        }
        
        auth.signInAnonymously().then(() => {
          const unsubscribe = db.collection(`crm_dbs/${adminId}/contacts`).onSnapshot(snapshot => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setContacts(data);
            setIsLoading(false);
          }, err => { console.error(err); setIsLoading(false); });
          return () => unsubscribe();
        }).catch(err => {
          console.error("連線失敗:", err);
          setIsLoading(false);
        });
      }, [adminId]);

      // 儲存資料
      const saveContact = async (e) => {
        e.preventDefault();
        if (!formData.name.trim()) return;

        const finalCategory = formData.category === 'custom' ? formData.customCategory.trim() : formData.category;
        const contactData = { ...formData, category: finalCategory || '未分類', updatedAt: Date.now() };
        delete contactData.customCategory;

        try {
          if (isCloudEnabled) {
            if (editingId) await db.doc(`crm_dbs/${adminId}/contacts/${editingId}`).update(contactData);
            else await db.collection(`crm_dbs/${adminId}/contacts`).add({ ...contactData, createdAt: Date.now() });
          } else {
            let newData;
            if (editingId) newData = contacts.map(c => c.id === editingId ? { ...c, ...contactData } : c);
            else newData = [{ ...contactData, id: Date.now().toString(), createdAt: Date.now() }, ...contacts];
            setContacts(newData);
            localStorage.setItem(`crm_data_${adminId}`, JSON.stringify(newData));
          }
          setIsModalOpen(false);
          // 若是在檢視狀態下編輯，儲存後更新檢視畫面
          if (viewingContact) {
            setViewingContact({ ...viewingContact, ...contactData });
          }
        } catch (err) { 
          alert("儲存失敗"); 
        }
      };

      // 刪除資料
      const deleteContact = async (id) => {
        if (!window.confirm("確定要刪除這位人才的資料嗎？")) return;
        if (isCloudEnabled) {
          try { await db.doc(`crm_dbs/${adminId}/contacts/${id}`).delete(); } catch (e) { alert("刪除失敗"); }
        } else {
          const newData = contacts.filter(c => c.id !== id);
          setContacts(newData);
          localStorage.setItem(`crm_data_${adminId}`, JSON.stringify(newData));
        }
        if (viewingContact && viewingContact.id === id) setViewingContact(null);
      };

      // 運算邏輯
      const allCategories = useMemo(() => Array.from(new Set([...DEFAULT_CATEGORIES, ...contacts.map(c => c.category).filter(Boolean)])), [contacts]);
      const categoryCounts = useMemo(() => {
        const counts = { '全部': contacts.length };
        allCategories.forEach(cat => counts[cat] = contacts.filter(c => c.category === cat).length);
        return counts;
      }, [contacts, allCategories]);
      
      const allUsedTags = useMemo(() => {
        const tags = new Set();
        contacts.forEach(c => c.skills?.forEach(s => tags.add(s)));
        return Array.from(tags);
      }, [contacts]);
      const combinedSuggestions = useMemo(() => Array.from(new Set([...PREDEFINED_TAGS, ...allUsedTags])), [allUsedTags]);
      
      const topSkills = useMemo(() => {
        const counts = {};
        contacts.forEach(c => c.skills?.forEach(s => counts[s] = (counts[s] || 0) + 1));
        return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6).map(e => ({ name: e[0], count: e[1] }));
      }, [contacts]);
      
      const filteredContacts = useMemo(() => contacts.filter(c => {
        const searchStr = searchTerm.toLowerCase();
        const matchSearch = (c.name||'').toLowerCase().includes(searchStr) || (c.role||'').toLowerCase().includes(searchStr) || (c.company||'').toLowerCase().includes(searchStr) || (c.notes||'').toLowerCase().includes(searchStr) || (c.skills||[]).some(s => s.toLowerCase().includes(searchStr));
        const matchCat = selectedCategory === '全部' ? true : c.category === selectedCategory;
        return matchSearch && matchCat;
      }), [contacts, searchTerm, selectedCategory]);

      // 核心變更：將過濾後的人脈，依照「專長標籤」進行分組 (Grouping)
      const groupedContacts = useMemo(() => {
        const groups = {};
        filteredContacts.forEach(c => {
          if (!c.skills || c.skills.length === 0) {
            if (!groups['未分類專長']) groups['未分類專長'] = [];
            groups['未分類專長'].push(c);
          } else {
            c.skills.forEach(skill => {
              if (!groups[skill]) groups[skill] = [];
              groups[skill].push(c);
            });
          }
        });
        // 依照群組內的人數多寡降冪排序
        return Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
      }, [filteredContacts]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsParsingCard(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h) { if (w > 600) { h *= 600 / w; w = 600; } } else { if (h > 600) { w *= 600 / h; h = 600; } }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            setFormData(prev => ({ ...prev, cardImage: canvas.toDataURL('image/jpeg', 0.6) }));
            setIsParsingCard(false);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleInputChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));

      const openModal = (contact = null) => {
        if (contact) {
          setEditingId(contact.id);
          setFormData({ ...contact, skills: contact.skills || [], category: allCategories.includes(contact.category) ? contact.category : 'custom', customCategory: allCategories.includes(contact.category) ? '' : contact.category });
        } else {
          setEditingId(null);
          setFormData({ name: '', role: '', company: '', email: '', phone: '', lineId: '', instagram: '', otherLink: '', cardImage: '', skills: [], notes: '', trustLevel: 3, lastContacted: new Date().toISOString().split('T')[0], category: '技術', customCategory: '' });
        }
        setIsModalOpen(true);
      };
      
      const closeModal = () => { setIsModalOpen(false); setEditingId(null); };

      // ==========================================
      // 畫面渲染區塊
      // ==========================================

      return (
        <div className="min-h-screen text-slate-800 pb-20 md:pb-0 relative">
          {/* Header */}
          <header className="bg-white shadow-sm border-b border-teal/20 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <div className="bg-navy p-2 rounded-xl shadow-sm"><Icon name="work" className="text-white !text-[20px]" /></div>
                <h1 className="text-xl md:text-2xl font-black text-navy tracking-tight">人脈<span className="text-teal">中心</span></h1>
              </div>
              <div className="flex items-center space-x-2">
                {!isCloudEnabled && <span className="hidden lg:inline text-xs font-bold bg-peach text-coral px-3 py-1 rounded-full shadow-sm mr-2" title="資料僅存於此設備">單機模式</span>}
                <button onClick={() => openModal()} className="flex items-center justify-center bg-coral hover:opacity-90 text-white px-4 py-2 rounded-xl shadow-md transition-colors">
                  <Icon name="person_add" className="!text-[20px] md:mr-1.5" />
                  <span className="hidden md:inline font-bold text-sm">手動新增</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6">
            {/* 置頂搜尋 */}
            <div className="bg-navy p-5 rounded-3xl mb-6 shadow-lg shadow-navy/20 relative overflow-hidden flex flex-col md:flex-row items-center justify-between z-20">
              <Icon name="hotel_class" className="absolute top-0 right-10 text-teal/20 !text-[120px] -translate-y-4" />
              <h2 className="text-xl font-black text-white mb-3 md:mb-0 relative z-10 whitespace-nowrap md:mr-6 flex items-center">
                <Icon name="search" className="mr-1.5 text-peach" /> 找人才
              </h2>
              <div className="relative z-10 flex-1 w-full flex items-center bg-white rounded-2xl p-1.5 shadow-inner focus-within:ring-4 focus-within:ring-teal/50 transition-all">
                 <input type="text" placeholder="搜尋專長、姓名、公司..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="bg-transparent w-full p-2 text-navy placeholder-teal/70 outline-none font-bold" />
                 {searchTerm && <button onClick={() => setSearchTerm('')} className="p-1.5 text-teal hover:text-coral"><Icon name="close" /></button>}
              </div>
            </div>

            <div className="flex flex-col lg:flex-row gap-6">
              {/* 側邊目錄 */}
              <aside className="w-full lg:w-56 shrink-0">
                <div className="bg-white rounded-3xl p-4 border border-teal/20 shadow-sm sticky top-[80px]">
                  <h3 className="text-xs font-black text-teal mb-3 px-2 flex items-center uppercase"><Icon name="folder_open" className="!text-[16px] mr-1.5" /> 分類目錄</h3>
                  <nav className="flex flex-row lg:flex-col overflow-x-auto lg:overflow-visible hide-scrollbar space-x-2 lg:space-x-0 lg:space-y-1.5 pb-2 lg:pb-0">
                    {allCategories.map(cat => (
                       <button key={cat} onClick={() => setSelectedCategory(cat)} className={`flex-shrink-0 flex items-center justify-between px-4 py-2.5 rounded-xl font-bold transition-all text-sm ${selectedCategory === cat ? 'bg-navy text-white shadow-md' : 'text-slate-600 hover:bg-peach/30 hover:text-navy'}`}>
                          <span className="whitespace-nowrap">{cat}</span>
                          <span className={`hidden lg:inline-block ml-3 text-xs py-0.5 px-2.5 rounded-full font-black transition-colors ${selectedCategory === cat ? 'bg-peach text-navy' : 'bg-cream text-teal'}`}>{categoryCounts[cat] || 0}</span>
                       </button>
                    ))}
                  </nav>
                </div>
              </aside>

              {/* 主要內容區 */}
              <div className="flex-1 min-w-0">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                  <div className="bg-white p-5 rounded-3xl border border-teal/20 shadow-sm flex flex-col justify-center relative overflow-hidden">
                     <div className="absolute -right-4 -top-4 bg-peach/40 w-20 h-20 rounded-full"></div>
                     <div className="relative z-10">
                        <div className="flex items-center space-x-1.5 mb-1"><Icon name="groups" className="text-coral !text-[20px]" /><h3 className="font-bold text-navy text-sm">人脈總數</h3></div>
                        <div className="text-3xl font-black text-navy">{contacts.length} <span className="text-sm font-medium text-teal">位</span></div>
                     </div>
                  </div>
                  <div className="bg-white p-5 rounded-3xl border border-teal/20 shadow-sm md:col-span-2 flex flex-col justify-center">
                     <div className="flex items-center space-x-1.5 mb-3"><Icon name="trending_up" className="text-teal !text-[20px]"/><h3 className="font-bold text-navy text-sm">熱門技能標籤</h3></div>
                     <div className="flex flex-wrap gap-2">
                       {topSkills.length > 0 ? topSkills.map(skill => (
                         <div key={skill.name} className="flex items-center bg-cream border border-peach px-2.5 py-1 rounded-lg text-xs">
                           <span className="font-bold text-navy mr-1.5">{skill.name}</span>
                           <span className="bg-teal/20 text-navy text-[10px] font-bold px-1.5 py-0.5 rounded-full">{skill.count}</span>
                         </div>
                       )) : <span className="text-teal text-xs font-medium">尚無技能標籤資料</span>}
                     </div>
                  </div>
                </div>

                {isLoading ? (
                  <div className="text-center py-20 text-teal"><Icon name="sync" className="animate-spin !text-[32px] mb-2" /><p className="font-bold">資料載入中...</p></div>
                ) : filteredContacts.length === 0 ? (
                  <div className="text-center py-16 bg-white rounded-3xl border border-dashed border-teal/40 shadow-sm">
                    <Icon name="person_add" className="!text-[64px] text-teal/40 mb-4" />
                    <h3 className="text-xl font-black text-navy mb-2">{contacts.length === 0 ? "準備開始建立人脈吧！" : "找不到符合的人才"}</h3>
                    <p className="text-teal text-sm mb-6">{contacts.length === 0 ? "點擊右上角「手動新增」，將重要的人脈記錄下來。" : "請嘗試更換搜尋關鍵字。"}</p>
                    {contacts.length === 0 && <button onClick={() => openModal()} className="bg-coral text-white font-bold px-6 py-3 rounded-xl shadow-lg shadow-coral/30 hover:opacity-90 active:scale-95 transition-all"><Icon name="add" className="mr-1" />建立第一筆資料</button>}
                  </div>
                ) : (
                  // 新版 UI：依照專長分類的橫向卷軸設計
                  <div className="space-y-8">
                    {groupedContacts.map(([skill, contactsInSkill]) => (
                      <div key={skill} className="bg-white rounded-3xl p-5 shadow-sm border border-teal/20 flex flex-col relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-peach/30 to-transparent rounded-bl-full pointer-events-none"></div>
                        
                        {/* 專長群組標題 */}
                        <div className="flex items-center mb-4 relative z-10">
                          <Icon name="label" className="text-coral mr-2" />
                          <h3 className="text-lg font-black text-navy">{skill}</h3>
                          <span className="ml-3 bg-peach text-navy text-xs font-bold px-2.5 py-0.5 rounded-full shadow-sm">{contactsInSkill.length}</span>
                        </div>
                        
                        {/* 橫向滑動區塊 (解決網頁過長問題) */}
                        <div className="flex overflow-x-auto hide-scrollbar gap-4 pb-2 -mx-1 px-1 relative z-10">
                          {contactsInSkill.map(contact => (
                            <div 
                              key={contact.id} 
                              onClick={() => setViewingContact(contact)} 
                              className="shrink-0 w-64 bg-cream/40 border border-teal/30 rounded-2xl p-4 cursor-pointer hover:bg-white hover:border-navy hover:shadow-md transition-all flex flex-col relative group"
                            >
                              <h4 className="font-black text-navy text-base line-clamp-1 pr-6">{contact.name}</h4>
                              {contact.cardImage && <Icon name="credit_card" className="absolute top-4 right-4 text-teal !text-[18px] group-hover:text-coral transition-colors" />}
                              <p className="text-xs font-bold text-teal mt-1 line-clamp-1">{contact.role} {contact.company && `@ ${contact.company}`}</p>
                              
                              <div className="mt-4 pt-3 border-t border-teal/10 flex justify-between items-center">
                                <div className="flex space-x-0.5">
                                  {[1,2,3,4,5].map(s => <Icon key={s} name="star" className={`!text-[12px] ${s <= contact.trustLevel ? 'text-coral' : 'text-teal/20'}`} />)}
                                </div>
                                <span className="text-[10px] text-navy bg-peach/50 px-2 py-0.5 rounded-md font-bold group-hover:bg-peach transition-colors">檢視檔案</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </main>

          {/* 新增/編輯人脈表單 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-[60] overflow-y-auto p-4 flex items-center justify-center">
              <div className="fixed inset-0 bg-navy/60 backdrop-blur-sm" onClick={closeModal}></div>
              <div className="relative w-full max-w-2xl bg-white shadow-2xl rounded-3xl border border-teal/30 flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-center p-5 border-b border-teal/10 shrink-0">
                  <h3 className="text-xl font-black text-navy">{editingId ? '編輯檔案' : '手動建檔'}</h3>
                  <button onClick={closeModal} className="text-teal bg-cream p-1.5 rounded-full hover:bg-peach transition-colors"><Icon name="close" /></button>
                </div>
                <div className="p-5 overflow-y-auto hide-scrollbar">
                  <form id="contactForm" onSubmit={saveContact} className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="space-y-3">
                        <div><label className="text-xs font-bold text-navy block mb-1">姓名 *</label><input required type="text" name="name" value={formData.name} onChange={handleInputChange} className="w-full px-3 py-2 bg-white border border-teal/30 rounded-xl focus:ring-2 focus:ring-teal outline-none font-bold text-sm" /></div>
                        <div className="flex space-x-2">
                          <div className="w-1/2"><label className="text-xs font-bold text-navy block mb-1">職稱</label><input type="text" name="role" value={formData.role} onChange={handleInputChange} className="w-full px-3 py-2 bg-white border border-teal/30 rounded-xl outline-none text-sm" /></div>
                          <div className="w-1/2"><label className="text-xs font-bold text-navy block mb-1">公司</label><input type="text" name="company" value={formData.company} onChange={handleInputChange} className="w-full px-3 py-2 bg-white border border-teal/30 rounded-xl outline-none text-sm" /></div>
                        </div>
                        <div>
                          <label className="text-xs font-bold text-navy block mb-1">聯絡方式</label>
                          <div className="grid grid-cols-2 gap-2">
                            <div className="relative"><Icon name="chat" className="!text-[14px] text-green-500 absolute left-2.5 top-2.5" /><input type="text" name="lineId" value={formData.lineId} onChange={handleInputChange} className="w-full pl-7 pr-2 py-2 border border-teal/20 rounded-xl outline-none text-xs" placeholder="LINE ID" /></div>
                            <div className="relative"><Icon name="photo_camera" className="!text-[14px] text-pink-500 absolute left-2.5 top-2.5" /><input type="text" name="instagram" value={formData.instagram} onChange={handleInputChange} className="w-full pl-7 pr-2 py-2 border border-teal/20 rounded-xl outline-none text-xs" placeholder="IG" /></div>
                            <div className="relative"><Icon name="call" className="!text-[14px] text-teal absolute left-2.5 top-2.5" /><input type="tel" name="phone" value={formData.phone} onChange={handleInputChange} className="w-full pl-7 pr-2 py-2 border border-teal/20 rounded-xl outline-none text-xs" placeholder="電話" /></div>
                            <div className="relative"><Icon name="mail" className="!text-[14px] text-teal absolute left-2.5 top-2.5" /><input type="email" name="email" value={formData.email} onChange={handleInputChange} className="w-full pl-7 pr-2 py-2 border border-teal/20 rounded-xl outline-none text-xs" placeholder="Email" /></div>
                          </div>
                        </div>
                      </div>
                      <div className="space-y-3">
                        <div>
                          <label className="text-xs font-bold text-navy block mb-1">歸屬目錄</label>
                          <select name="category" value={formData.category} onChange={handleInputChange} className="w-full px-3 py-2 border border-teal/30 rounded-xl outline-none font-bold text-sm">
                            {DEFAULT_CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                            <option value="custom">-- 自訂新分類 --</option>
                          </select>
                          {formData.category === 'custom' && <input type="text" name="customCategory" value={formData.customCategory} onChange={handleInputChange} className="w-full mt-2 px-3 py-2 bg-cream border border-peach rounded-xl outline-none text-sm font-bold" placeholder="新分類名稱..." required />}
                        </div>
                        
                        {/* 修復：為星星圖示補回 onClick 事件包裹器 */}
                        <div>
                          <label className="text-xs font-bold text-navy block mb-1">信任評等 (1-5)</label>
                          <div className="flex space-x-1 p-1.5 bg-cream/50 rounded-xl border border-teal/20 justify-around">
                            {[1, 2, 3, 4, 5].map(star => (
                              <button 
                                key={star} 
                                type="button" 
                                onClick={() => setFormData(p => ({ ...p, trustLevel: star }))} 
                                className="focus:outline-none transition-transform hover:scale-110"
                              >
                                <Icon name="star" className={`!text-[24px] ${formData.trustLevel >= star ? 'text-coral' : 'text-teal/20'}`} />
                              </button>
                            ))}
                          </div>
                        </div>
                        
                        <div><label className="text-xs font-bold text-navy block mb-1">專長標籤</label><HashtagInput value={formData.skills} onChange={(s) => setFormData(p => ({ ...p, skills: s }))} suggestions={combinedSuggestions} /></div>
                      </div>
                    </div>
                    <div><label className="text-xs font-bold text-navy block mb-1">對話筆記</label><textarea name="notes" value={formData.notes} onChange={handleInputChange} rows={2} className="w-full px-3 py-2 border border-teal/30 rounded-xl outline-none resize-none text-sm" placeholder="記下備註..."></textarea></div>
                  </form>
                </div>
                <div className="p-4 border-t border-teal/10 shrink-0 flex justify-end space-x-3 bg-white rounded-b-3xl">
                  <button type="button" onClick={closeModal} className="px-5 py-2 rounded-xl text-teal font-bold hover:bg-cream">取消</button>
                  <button type="submit" form="contactForm" className="px-6 py-2 rounded-xl bg-coral text-white font-black hover:opacity-90 shadow-lg shadow-coral/30">儲存資料</button>
                </div>
              </div>
            </div>
          )}

          {/* 獨立名片檢視視窗 (Modal View) */}
          {viewingContact && (
            <div className="fixed inset-0 z-50 overflow-y-auto p-4 flex items-center justify-center">
              <div className="fixed inset-0 bg-navy/60 backdrop-blur-sm" onClick={() => setViewingContact(null)}></div>
              <div className="relative w-full max-w-md bg-white shadow-2xl rounded-3xl border border-teal/30 flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-center p-5 border-b border-teal/10 shrink-0 bg-cream/30 rounded-t-3xl">
                  <h3 className="text-lg font-black text-navy flex items-center"><Icon name="person" className="mr-1.5 text-coral" /> 人脈檔案</h3>
                  <button onClick={() => setViewingContact(null)} className="text-teal bg-white shadow-sm p-1.5 rounded-full hover:bg-peach transition-colors"><Icon name="close" /></button>
                </div>
                <div className="p-6 overflow-y-auto hide-scrollbar space-y-6">
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="inline-block text-[10px] font-black tracking-wider text-navy bg-peach px-2 py-0.5 rounded-md mb-2">{viewingContact.category}</span>
                      <h2 className="text-3xl font-black text-navy">{viewingContact.name}</h2>
                      <p className="text-teal font-bold text-sm mt-1">{viewingContact.role} {viewingContact.company && ` @ ${viewingContact.company}`}</p>
                    </div>
                    <div className="flex flex-col items-end">
                      <div className="flex space-x-0.5">{[1, 2, 3, 4, 5].map(s => (<Icon key={s} name="star" className={`!text-[16px] ${s <= viewingContact.trustLevel ? 'text-coral' : 'text-cream'}`} />))}</div>
                      <span className="text-[10px] text-navy/40 mt-1 font-bold">信任評等</span>
                    </div>
                  </div>
                  
                  {viewingContact.cardImage && (
                    <div className="rounded-xl overflow-hidden border border-teal/20 shadow-sm">
                      <img src={viewingContact.cardImage} alt="名片" className="w-full h-auto object-cover" />
                    </div>
                  )}

                  <div className="bg-cream/50 rounded-2xl p-4 border border-teal/10">
                    <h4 className="text-xs font-bold text-navy mb-3">聯絡方式</h4>
                    <div className="grid grid-cols-5 gap-2">
                      {viewingContact.lineId ? <a href={`https://line.me/R/ti/p/~${viewingContact.lineId}`} target="_blank" className="flex flex-col items-center p-2 bg-white rounded-xl shadow-sm text-green-500 hover:scale-105 transition-transform"><Icon name="chat" className="!text-[20px] mb-1"/><span className="text-[9px] font-bold">LINE</span></a> : <div className="flex flex-col items-center p-2 bg-transparent text-teal/20"><Icon name="chat" className="!text-[20px] mb-1"/><span className="text-[9px]">LINE</span></div>}
                      {viewingContact.instagram ? <a href={`https://instagram.com/${viewingContact.instagram.replace('@', '')}`} target="_blank" className="flex flex-col items-center p-2 bg-white rounded-xl shadow-sm text-pink-500 hover:scale-105 transition-transform"><Icon name="photo_camera" className="!text-[20px] mb-1"/><span className="text-[9px] font-bold">IG</span></a> : <div className="flex flex-col items-center p-2 bg-transparent text-teal/20"><Icon name="photo_camera" className="!text-[20px] mb-1"/><span className="text-[9px]">IG</span></div>}
                      {viewingContact.phone ? <a href={`tel:${viewingContact.phone}`} className="flex flex-col items-center p-2 bg-white rounded-xl shadow-sm text-navy hover:scale-105 transition-transform"><Icon name="call" className="!text-[20px] mb-1"/><span className="text-[9px] font-bold">電話</span></a> : <div className="flex flex-col items-center p-2 bg-transparent text-teal/20"><Icon name="call" className="!text-[20px] mb-1"/><span className="text-[9px]">電話</span></div>}
                      {viewingContact.email ? <a href={`mailto:${viewingContact.email}`} className="flex flex-col items-center p-2 bg-white rounded-xl shadow-sm text-teal hover:scale-105 transition-transform"><Icon name="mail" className="!text-[20px] mb-1"/><span className="text-[9px] font-bold">信箱</span></a> : <div className="flex flex-col items-center p-2 bg-transparent text-teal/20"><Icon name="mail" className="!text-[20px] mb-1"/><span className="text-[9px]">信箱</span></div>}
                      {viewingContact.otherLink ? <a href={viewingContact.otherLink} target="_blank" className="flex flex-col items-center p-2 bg-white rounded-xl shadow-sm text-coral hover:scale-105 transition-transform"><Icon name="link" className="!text-[20px] mb-1"/><span className="text-[9px] font-bold">連結</span></a> : <div className="flex flex-col items-center p-2 bg-transparent text-teal/20"><Icon name="link" className="!text-[20px] mb-1"/><span className="text-[9px]">連結</span></div>}
                    </div>
                  </div>

                  {viewingContact.skills && viewingContact.skills.length > 0 && (
                    <div>
                      <h4 className="text-xs font-bold text-navy mb-2 flex items-center"><Icon name="tag" className="!text-[14px] text-coral mr-1" />專業標籤</h4>
                      <div className="flex flex-wrap gap-1.5">
                        {viewingContact.skills.map(s => <span key={s} className="px-2.5 py-1 rounded-md text-[11px] font-bold bg-teal/10 text-navy border border-teal/20">#{s}</span>)}
                      </div>
                    </div>
                  )}

                  {viewingContact.notes && (
                    <div>
                      <h4 className="text-xs font-bold text-navy mb-2 flex items-center"><Icon name="edit_note" className="!text-[14px] text-teal mr-1" />對話筆記</h4>
                      <p className="text-sm font-medium text-slate-600 bg-white p-4 rounded-xl border border-teal/20 whitespace-pre-wrap leading-relaxed shadow-sm">{viewingContact.notes}</p>
                    </div>
                  )}
                </div>
                
                <div className="p-4 border-t border-teal/10 shrink-0 flex justify-between items-center bg-white rounded-b-3xl">
                  <div className="flex items-center text-[10px] font-bold text-teal"><Icon name="calendar_today" className="!text-[14px] mr-1" />最後聯絡：{viewingContact.lastContacted || '無紀錄'}</div>
                  <div className="flex space-x-2">
                    <button onClick={() => { setViewingContact(null); deleteContact(viewingContact.id); }} className="px-4 py-2 rounded-xl text-coral bg-coral/10 hover:bg-coral/20 font-bold text-sm transition-colors">刪除</button>
                    <button onClick={() => { openModal(viewingContact); }} className="px-6 py-2 rounded-xl bg-navy text-white font-black hover:bg-navy/90 shadow-md text-sm transition-colors">編輯</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
